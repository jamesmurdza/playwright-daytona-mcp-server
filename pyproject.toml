[project]
name = "daytona-playwright-mcp"
version = "0.1.0"
description = "MCP server for controlling Playwright browser in Daytona sandbox"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "daytona>=0.134.0",
    "fastmcp>=2.0.0",
    "patchright>=1.48",
]

[project.scripts]
daytona-playwright-mcp = "daytona_playwright_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daytona_playwright_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]
